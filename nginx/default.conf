server {
    listen                  80;
    server_name             localhost;

    gzip on;
    gzip_min_length         5k;
    gzip_buffers            4 16k;
    gzip_http_version       1.1;
    gzip_comp_level         4;
    gzip_types              text/plain application/javascript text/css application/xml text/javascript image/jpeg image/gif image/png application/json;
    gzip_vary               on;
    gzip_disable            "MSIE [1-6].";

    # 健康检查端点
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # 文档站点
    location / {
        alias  /app/html/;
        index  index.html;

        # VitePress cleanUrls：未命中时尝试加 .html 后缀
        try_files $uri $uri.html $uri/ /snz1/java/docs/404.html;
    }

    # 50x 错误页面
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
